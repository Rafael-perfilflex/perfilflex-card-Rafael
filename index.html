<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rafael Garcia | PerfilFlex</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
font-family:Arial, Helvetica, sans-serif;
background:#dfe7e4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
width:340px;
background:white;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
overflow:hidden;
text-align:center;
}

/* HEADER */

.header{
background:white;
padding:30px 20px 10px;
text-align:center;
}

.logo{
width:560px;
margin-bottom:10px;
}

.header h1{
font-size:22px;
margin:5px 0;
color:#333;
}

.subtitle{
color:#2ea44f;
font-weight:600;
}

.divider{
width:80%;
height:3px;
background:#2ea44f;
margin:15px auto 10px auto;
border-radius:3px;
}

/* DESCRIÇÃO */

.desc{
font-size:14px;
color:#555;
padding:10px 25px 20px 25px;
}

/* CONTATOS */

.contact{
display:flex;
align-items:center;
margin:10px 20px;
}

.icon{
width:40px;
font-size:20px;
color:#5a5a5a;
text-align:center;
}

.btn{
flex:1;
padding:12px;
border-radius:25px;
border:none;
font-size:15px;
cursor:pointer;
text-decoration:none;
display:block;
transition:0.2s;
}

.green{
background:linear-gradient(90deg,#2ea44f,#3bd164);
color:white;
}

.gray{
background:#f0f0f0;
color:#333;
}

.btn:hover{
transform:scale(1.02);
}

/* BOTÃO CONTATO */

.save{
margin:20px;
}

.footer{
font-size:12px;
color:#777;
padding-bottom:20px;
}

</style>

</head>

<body>

<div class="card">

<div class="header">

<img src="PerfilFlex_600dpi.png" class="logo">

<h1>Rafael Garcia</h1>

<div class="subtitle">
Diretor Comercial
</div>

<div class="divider"></div>

</div>


<div class="desc">
Engenharia em polímeros termoplásticos de alta performance e durabilidade
</div>


<div class="contact">
<div class="icon"><i class="fa-solid fa-phone"></i></div>
<a class="btn green" href="tel:+5511913291805">Ligar</a>
</div>


<div class="contact">
<div class="icon"><i class="fa-brands fa-whatsapp"></i></div>
<a class="btn green" href="https://wa.me/5511913291805">WhatsApp</a>
</div>


<div class="contact">
<div class="icon"><i class="fa-solid fa-envelope"></i></div>
<a class="btn gray" href="mailto:rafael.garcia@perfilflex.com">Email</a>
</div>


<div class="contact">
<div class="icon"><i class="fa-solid fa-globe"></i></div>
<a class="btn gray" href="https://perfilflex.com/">Site</a>
</div>


<div class="contact">
<div class="icon"><i class="fa-brands fa-linkedin"></i></div>
<a class="btn gray" href="https://www.linkedin.com/company/perfil-flex">LinkedIn</a>
</div>


<div class="contact">
<div class="icon"><i class="fa-brands fa-instagram"></i></div>
<a class="btn gray" href="https://www.instagram.com/perfilflexperfis">Instagram</a>
</div>


<div class="contact">
<div class="icon"><i class="fa-solid fa-location-dot"></i></div>
<a class="btn gray" href="https://maps.google.com/?q=Rua+Natal+106+Santo+Andre">Localização</a>
</div>


<div class="save">

<a class="btn green" href="rafael-garcia.vcf">
<i class="fa-solid fa-user-plus"></i> Adicionar contato
</a>

</div>


<div class="footer">
PerfilFlex © 2026
</div>


</div>

</body>
</html>
